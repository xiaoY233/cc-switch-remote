name: WSL2 Nightly

# The full backend suite takes 50+ minutes on a \\wsl.localhost 9P filesystem,
# so it runs nightly instead of per PR. The per-PR gate in ci.yml only runs the
# atomic-write contract test against the same WSL2-backed environment.
on:
  schedule:
    - cron: "23 18 * * *" # 02:23 Beijing time
  workflow_dispatch:

jobs:
  backend-windows-wsl2-full:
    name: Backend Full Suite (Windows + WSL2 home)
    runs-on: windows-2025
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Setup WSL2
        uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2

      - name: Cache Cargo registry and build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Create frontend dist placeholder
        shell: bash
        run: mkdir -p dist

      - name: Prepare WSL2-backed test environment
        shell: pwsh
        run: |
          wsl.exe -d Ubuntu-24.04 -- bash -lc "rm -rf /tmp/cc-switch-windows-test-root && mkdir -p /tmp/cc-switch-windows-test-root/{home,temp} && chmod -R 0777 /tmp/cc-switch-windows-test-root"
          $testRoot = "\\wsl.localhost\Ubuntu-24.04\tmp\cc-switch-windows-test-root"
          $testHome = Join-Path $testRoot "home"
          $testTemp = Join-Path $testRoot "temp"
          foreach ($path in @($testRoot, $testHome, $testTemp)) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "WSL2-backed test path is unavailable: $path"
            }
          }
          "CC_SWITCH_TEST_HOME=$testHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CC_SWITCH_WSL_TEST_DIR=$testRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CC_SWITCH_WSL_TEST_TEMP=$testTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile backend tests with native temp
        # link.exe/mt.exe cannot create manifests when TEMP points at a WSL UNC path.
        # Persist every test executable so later steps can use WSL-backed TEMP
        # without asking Cargo to link again.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        shell: pwsh
        run: |
          $testArtifacts = cargo test --tests --manifest-path src-tauri/Cargo.toml --no-run --message-format=json |
            ForEach-Object {
              if ($_ -match '"reason":"compiler-artifact"') {
                $artifact = $_ | ConvertFrom-Json
                if ($artifact.executable -and $artifact.profile.test) {
                  [PSCustomObject]@{
                    executable = $artifact.executable
                    targetName = $artifact.target.name
                  }
                }
              }
            }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (-not $testArtifacts) {
            throw "No Rust test executables found in Cargo compiler artifacts"
          }
          $libTestBinary = $testArtifacts |
            Where-Object { $_.targetName -eq 'cc_switch_lib' } |
            Select-Object -ExpandProperty executable -First 1
          if (-not $libTestBinary) {
            throw "cc_switch_lib test binary not found in Cargo compiler artifacts"
          }
          $testBinariesPath = Join-Path $env:RUNNER_TEMP "cc-switch-test-binaries.json"
          @($testArtifacts.executable) |
            ConvertTo-Json |
            Set-Content -LiteralPath $testBinariesPath -Encoding utf8
          "CC_SWITCH_LIB_TEST_EXE=$libTestBinary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CC_SWITCH_TEST_BINARIES_FILE=$testBinariesPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run Windows-to-WSL2 filesystem contract
        shell: pwsh
        run: |
          $env:TEMP = $env:CC_SWITCH_WSL_TEST_TEMP
          $env:TMP = $env:CC_SWITCH_WSL_TEST_TEMP
          $testName = "config::tests::atomic_write_replaces_existing_wsl_unc_file"
          $testList = & $env:CC_SWITCH_LIB_TEST_EXE --list --ignored
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $expected = "${testName}: test"
          if ($testList -notcontains $expected) {
            throw "Expected ignored test was not discovered: $testName"
          }
          & $env:CC_SWITCH_LIB_TEST_EXE $testName --ignored --exact --nocapture
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Run full test suite against WSL2-backed home
        shell: pwsh
        run: |
          $env:TEMP = $env:CC_SWITCH_WSL_TEST_TEMP
          $env:TMP = $env:CC_SWITCH_WSL_TEST_TEMP
          $testBinaries = Get-Content -LiteralPath $env:CC_SWITCH_TEST_BINARIES_FILE -Raw |
            ConvertFrom-Json
          $failedBinaries = @()
          foreach ($testBinary in @($testBinaries)) {
            & $testBinary --test-threads=1
            if ($LASTEXITCODE -ne 0) {
              $failedBinaries += $testBinary
            }
          }
          if ($failedBinaries.Count -gt 0) {
            throw "Rust test binaries failed: $($failedBinaries -join ', ')"
          }
